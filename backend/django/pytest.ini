[pytest]
# P8 — hermetic risk-layer tests under app/risk/tests/
# The tests dir has NO __init__.py, so pytest's default "prepend" import mode imports
# conftest.py and test_*.py as TOP-LEVEL modules and never imports the real `app` package
# (no Django/Celery/settings needed) — the risk modules are loaded by path in conftest.
# DO NOT set addopts = --import-mode=importlib here: importlib mode would import the real
# `app` package (its __init__ imports celery) and fail on a dev PC without it.